common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/imu/data"
    time_sync_en: true         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 6
    blind: 4

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    90
    det_range:     450.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_T: [ -0.042156, -0.059088, -0.054413 ]
    extrinsic_R: [
      0.996857,  0.079234, -0.000804,
      -0.079211,  0.996468,  0.028222,
      0.003030, -0.028064,  0.999601
    ]

publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

result_save:
    feat_accum_save_en: true     # save accumulated world-frame undistorted feature scans as PCD
    interval: -1                 # how many LiDAR frames to accumulate before writing one PCD; -1 saves only once at shutdown
    imu_pose_save_en: false      # save each IMU pose to ROOT_DIR/IMU_POSES/poses.txt
    scan_frame_save_en: false    # save each undistorted scan in LiDAR body frame and pose to ROOT_DIR/SCAN_FRAMES/

zupt:
    use_zupt: false              # enable zero velocity update
    zupt_acc_var_threshold: 0.0001   # (m/s²)² acceleration variance threshold for ZUPT
    zupt_gyro_var_threshold: 0.00001 # (rad/s)² gyroscope variance threshold for ZUPT
