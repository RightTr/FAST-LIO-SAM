common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    high_freq_base_frame: "base_link_hf"
    mode: 1                     # 1: online / 2: prior / 3: online+prior
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
    grav_align: true            # Whether to use gravity alignment for initial roll/pitch estimation.

prior_map:
    prior_tree_path: ""      # static prior ikdtree snapshot path for prior update
    prior_lidar_cov: 0.001      # absolute LiDAR covariance used for prior matching
    prior_init: true

preprocess:
    lidar_type: 8               # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
    scan_line: 4
    blind: 1.0

mapping:
    point2point: false
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    imu_dt: 0.005
    timeRepair: true
    fov_degree:    360.0
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_R: [0.999996, -0.00129,  -0.00230,
                0.00129,   0.999999, -0.00130,
                0.00230,   0.00130,   0.999996]

    extrinsic_T: [-0.009673, -0.037003, 0.047590]

geo_map:
    enable: false
    debug: true
    support: 0.15
    plane_dist: 0.05

publish:
    path_en:  true
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame
    feature_pub_en: true
    effect_pub_en: true

result_save:
    feat_accum_save_en: false     # save accumulated world-frame undistorted feature scans as PCD
    interval: -1                 # how many LiDAR frames to accumulate before writing one PCD; -1 saves only once at shutdown
                                # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
    imu_state_save_en: true         # save each IMU state to ROOT_DIR/IMU_STATES/imu_states.txt
    scan_frame_save_en: false      # save each undistorted scan in LiDAR body frame and pose to ROOT_DIR/SCAN_FRAMES/
    ikdtree_output_save_en: false  # true: save the ikdtree point cloud to ROOT_DIR/TREE_CLOUDS/
